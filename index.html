<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدومنة - SpyGame</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --text-color: #e94560;
            --text-main: #fff;
            --board-bg: #0f3418;
            --btn-bg: #e94560;
            --btn-hover: #d1304b;
        }

        :root[data-theme="light"] {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --text-color: #333;
            --text-main: #111;
            --board-bg: #2e7d32;
            --btn-bg: #1976d2;
            --btn-hover: #1565c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-main); transition: all 0.3s ease; height: 100vh; display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--panel-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        button { background-color: var(--btn-bg); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; margin: 5px; }
        button:hover { background-color: var(--btn-hover); }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .menu-card { background-color: var(--panel-bg); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        .menu-card h2 { color: var(--text-color); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; background: #fff; color: #333; }

        #game-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        .game-board {
            flex: 1;
            background-color: var(--board-bg);
            border-radius: 15px;
            margin: 10px 20px;
            position: relative;
            display: flex;
            justify-content: center; 
            align-items: center;
            flex-wrap: nowrap; 
            overflow-x: auto; 
            border: 10px solid #5c4033;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            padding: 20px;
        }

        .player-hand { display: flex; justify-content: center; gap: 10px; padding: 15px; background-color: var(--panel-bg); flex-wrap: wrap; min-height: 140px; align-items: center; }

        /* -------------- تصميم الدومنة الحقيقي -------------- */
        .domino {
            width: 50px;
            height: 100px;
            background-color: #fdf5e6; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.6), inset 0 0 5px rgba(0,0,0,0.1);
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        /* كلاس الإضاءة للورق اللي ينفع يتلعب */
        .playable-glow {
            box-shadow: 0 0 15px #00ff88, inset 0 0 5px rgba(0, 255, 136, 0.3) !important;
            border: 2px solid #00ff88 !important;
            transform: translateY(-8px); /* بيرفع الورقة لفوق شوية عشان تبان */
        }
        
        .domino-horizontal { width: 100px; height: 50px; flex-direction: row; }

        .player-hand .domino:hover { transform: translateY(-12px); }

        .domino .half {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
        }

        .domino .divider { height: 2px; background-color: #222; width: 100%; margin: 2px 0; box-shadow: 0 1px 0 rgba(255,255,255,0.8); }
        .domino-horizontal .divider { width: 2px; height: 100%; margin: 0 2px; }

        .dot { width: 10px; height: 10px; background-color: #111; border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4); }

        .board-domino { margin: 1px; cursor: default; }
        .board-domino:hover { transform: none; }

        .action-panel { display: flex; justify-content: center; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>🎲 دومنة SpyGame</h1>
        <div>
            <span id="connection-status" style="color: #4caf50; margin-left: 15px;">متصل بالنت</span>
            <button onclick="toggleTheme()">💡 تغيير المود</button>
        </div>
    </header>

    <div class="container" id="main-menu">
        <div class="menu-card">
            <h2>اختار طريقة اللعب</h2>
            <button onclick="showScreen('offline-setup')">🤖 العب أوفلاين (مع البوت)</button>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.1);">
            <button onclick="showScreen('online-setup')">🌐 العب أونلاين</button>
        </div>
    </div>

    <div class="container hidden" id="offline-setup">
        <div class="menu-card">
            <h2>إعدادات اللعب مع البوت</h2>
            <div class="form-group">
                <label>عدد اللاعبين:</label>
                <select id="off-players">
                    <option value="2">2 (زوجي)</option>
                    <option value="3">3 لاعبين</option>
                    <option value="4">4 لاعبين</option>
                </select>
            </div>
            <div class="form-group">
                <label>الهدف (السكور):</label>
                <select id="off-score">
                    <option value="50">50 نقطة</option>
                    <option value="100">100 نقطة</option>
                </select>
            </div>
            <button onclick="startOfflineGame()">🚀 ابدأ اللعب</button>
            <button onclick="showScreen('main-menu')" style="background-color: #555;">رجوع</button>
        </div>
    </div>

    <div id="game-screen">
        <div style="text-align: center; padding: 10px;">
            <h3 id="game-info">الدور: دورك أنت</h3>
        </div>
        
        <div class="game-board" id="board">
            <p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>
        </div>

        <div class="action-panel">
            <button id="draw-btn" onclick="playerDraw()">📭 اسحب من البلاطة (<span id="deck-count">0</span>)</button>
            <button id="pass-btn" class="hidden" onclick="playerPass()" style="background-color: #f44336;">باص الدور 🛑</button>
        </div>

        <div class="player-hand" id="my-hand"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
            authDomain: "spygame-337ee.firebaseapp.com",
            databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
            projectId: "spygame-337ee",
            storageBucket: "spygame-337ee.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleTheme() {
            const root = document.documentElement;
            root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        }

        function showScreen(screenId) {
            document.querySelectorAll('.container, #game-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'game-screen') document.getElementById('game-screen').style.display = 'flex';
        }

        let deck = [], playersHands = [];
        let leftEnd = null;
        let rightEnd = null;
        let currentTurn = 0; 
        let currentMode = '';

        function generateDeck() {
            deck = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) {
                    deck.push([i, j]);
                }
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function dealCards(numPlayers) {
            playersHands = Array.from({ length: numPlayers }, () => []);
            for (let i = 0; i < 7; i++) {
                for (let p = 0; p < numPlayers; p++) {
                    playersHands[p].push(deck.pop());
                }
            }
            updateDeckCountUI();
        }

        function updateDeckCountUI() {
            document.getElementById('deck-count').innerText = deck.length;
        }

        function createDominoHTML(n1, n2) {
            function getHalf(num) {
                const patterns = {
                    0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 
                    4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
                };
                let html = '<div class="half">';
                for(let i = 0; i < 9; i++) {
                    html += patterns[num].includes(i) ? '<div class="dot"></div>' : '<div></div>';
                }
                html += '</div>';
                return html;
            }
            return getHalf(n1) + '<div class="divider"></div>' + getHalf(n2);
        }

        // --- التعديل هنا لتمييز الورق اللي ينفع يتلعب ---
        function renderHand(handIndex) {
            const handDiv = document.getElementById('my-hand');
            handDiv.innerHTML = ''; 
            
            playersHands[handIndex].forEach((bone, index) => {
                const boneEl = document.createElement('div');
                boneEl.className = 'domino';

                // فحص إذا كانت الورقة قابلة للعب (للاعب الأساسي بس)
                if (handIndex === 0 && currentTurn === 0) {
                    let isPlayable = false;
                    if (leftEnd === null && rightEnd === null) {
                        isPlayable = true; // أول دور كل الورق ينفع
                    } else if (bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd) {
                        isPlayable = true; // الورقة دي بتركب على طرف من الأطراف
                    }

                    if (isPlayable) {
                        boneEl.classList.add('playable-glow');
                    }
                }

                boneEl.innerHTML = createDominoHTML(bone[0], bone[1]);
                boneEl.onclick = () => playBone(handIndex, index);
                handDiv.appendChild(boneEl);
            });
            checkPlayerPossibilities();
        }

        function hasValidMove(hand) {
            if (leftEnd === null && rightEnd === null) return true; 
            return hand.some(bone => bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd);
        }

        function checkPlayerPossibilities() {
            if (currentTurn !== 0) {
                document.getElementById('pass-btn').classList.add('hidden');
                return;
            }
            
            if (!hasValidMove(playersHands[0]) && deck.length === 0) {
                document.getElementById('pass-btn').classList.remove('hidden');
            } else {
                document.getElementById('pass-btn').classList.add('hidden');
            }
        }

        function addDominoToBoardDOM(bone, side, flip, isBot = false) {
            const board = document.getElementById('board');
            const emptyMsg = document.getElementById('empty-msg');
            if(emptyMsg) emptyMsg.remove();

            const isDouble = bone[0] === bone[1];
            const boneEl = document.createElement('div');
            boneEl.className = 'domino board-domino';
            if (isBot) boneEl.style.boxShadow = "0 0 10px rgba(255, 68, 68, 0.8)"; 
            
            let htmlStr = '';
            if (isDouble) {
                htmlStr = createDominoHTML(bone[0], bone[1]);
            } else {
                boneEl.classList.add('domino-horizontal');
                htmlStr = flip ? createDominoHTML(bone[1], bone[0]) : createDominoHTML(bone[0], bone[1]);
            }
            
            boneEl.innerHTML = htmlStr;
            if (side === 'left') board.prepend(boneEl);
            else board.appendChild(boneEl);
        }

        function playBone(playerIndex, boneIndex) {
            if (currentTurn !== playerIndex) return; 

            let bone = playersHands[playerIndex][boneIndex];
            let playAt = null;
            let flip = false;

            if (leftEnd === null && rightEnd === null) {
                playAt = 'right';
            } else if (bone[0] === rightEnd) {
                playAt = 'right'; flip = false;
            } else if (bone[1] === rightEnd) {
                playAt = 'right'; flip = true;
            } else if (bone[0] === leftEnd) {
                playAt = 'left'; flip = true;
            } else if (bone[1] === leftEnd) {
                playAt = 'left'; flip = false;
            } else {
                alert('الورقة دي ماتركبش على الطاولة! شوف ورقة من اللي منورين.');
                return;
            }

            playersHands[playerIndex].splice(boneIndex, 1);
            
            if (leftEnd === null && rightEnd === null) {
                leftEnd = bone[0]; rightEnd = bone[1];
            } else if (playAt === 'right') {
                rightEnd = flip ? bone[0] : bone[1];
            } else if (playAt === 'left') {
                leftEnd = flip ? bone[1] : bone[0];
            }

            addDominoToBoardDOM(bone, playAt, flip, playerIndex !== 0);
            renderHand(playerIndex); // تحديث الإيد (هيشيل النور من الورق اللي كان منور لو الدور خلص)

            if(currentMode === 'offline') {
                currentTurn = 1;
                document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`;
                renderHand(0); // تحديث إيد اللاعب عشان نقفل النور وقت لعب البوت
                setTimeout(botPlay, 1500);
            }
        }

        function playerDraw() {
            if (currentTurn !== 0) return alert("مش دورك تسحب دلوقتي!");
            if (hasValidMove(playersHands[0])) return alert("معاك ورق ينفع يتلعب! العب الأول.");
            
            if (deck.length > 0) {
                let drawnBone = deck.pop();
                playersHands[0].push(drawnBone);
                updateDeckCountUI();
                renderHand(0);
                
                if (hasValidMove([drawnBone])) {
                    alert("طلعتلك ورقة تنفع! العبها دلوقتي.");
                }
            } else {
                alert("البلاطة فضيت خلاص! اضغط على باص الدور.");
            }
        }

        function playerPass() {
            if (currentTurn !== 0) return;
            currentTurn = 1;
            document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`;
            document.getElementById('pass-btn').classList.add('hidden');
            renderHand(0);
            setTimeout(botPlay, 1500);
        }

        function startOfflineGame() {
            currentMode = 'offline';
            currentTurn = 0; 
            const numPlayers = parseInt(document.getElementById('off-players').value);
            const targetScore = document.getElementById('off-score').value;

            document.getElementById('game-info').innerText = `الدور: دورك أنت`;
            document.getElementById('board').innerHTML = '<p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>';
            
            leftEnd = null;
            rightEnd = null;
            generateDeck();
            shuffleDeck();
            dealCards(numPlayers);
            renderHand(0);
            showScreen('game-screen');
        }

        function botPlay() {
            let hand = playersHands[1];
            if(!hand) return;

            if (hasValidMove(hand)) {
                executeBotMove();
            } 
            else if (deck.length > 0) {
                document.getElementById('game-info').innerText = `البوت بيسحب من البلاطة... 📭`;
                
                let drawInterval = setInterval(() => {
                    if (deck.length > 0 && !hasValidMove(hand)) {
                        let drawn = deck.pop();
                        hand.push(drawn);
                        updateDeckCountUI();
                    } else {
                        clearInterval(drawInterval);
                        if (hasValidMove(hand)) {
                            executeBotMove();
                        } else {
                            botPass();
                        }
                    }
                }, 1000);
            } else {
                botPass();
            }
        }

        function executeBotMove() {
            let hand = playersHands[1];
            for (let i = 0; i < hand.length; i++) {
                let bone = hand[i];
                if (leftEnd === null || bone[0] === rightEnd || bone[1] === rightEnd || bone[0] === leftEnd || bone[1] === leftEnd) {
                    playBone(1, i);
                    currentTurn = 0;
                    document.getElementById('game-info').innerText = `الدور: دورك أنت`;
                    renderHand(0); // تحديث الإضاءة عشان دورك رجع
                    break;
                }
            }
        }

        function botPass() {
            alert("البوت معهوش لعب وباصى الدور! 🛑");
            currentTurn = 0;
            document.getElementById('game-info').innerText = `الدور: دورك أنت`;
            renderHand(0); 
        }
    </script>
</body>
</html>
