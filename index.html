<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدومنة </title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-color: #1a1a2e; --panel-bg: #16213e; --text-color: #e94560; --text-main: #fff;
            --board-bg: #0f3418; --btn-bg: #e94560; --btn-hover: #d1304b; --chat-bg: #111a2e;
        }

        :root[data-theme="light"] {
            --bg-color: #f0f0f0; --panel-bg: #ffffff; --text-color: #333; --text-main: #111;
            --board-bg: #2e7d32; --btn-bg: #1976d2; --btn-hover: #1565c0; --chat-bg: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: all 0.3s ease; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--panel-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; }
        button { background-color: var(--btn-bg); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; margin: 5px; }
        button:hover { background-color: var(--btn-hover); }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .menu-card { background-color: var(--panel-bg); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        .menu-card h2 { color: var(--text-color); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; background: #fff; color: #333; font-weight: bold; }

        #game-screen { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin: 10px 20px 0; }
        .scoreboard { flex: 1; display: flex; justify-content: space-around; background-color: var(--panel-bg); padding: 10px; margin-right: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; border: 2px solid var(--btn-bg); }
        .score-item { color: #00ff88; }
        .score-bot { color: #ff4444; }

        /* -------------- الشات والفويس -------------- */
        .chat-btn { background-color: #2196f3; position: absolute; right: 20px; top: 70px; z-index: 100; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; padding: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .chat-panel { position: absolute; right: -350px; top: 130px; width: 300px; height: 400px; background-color: var(--chat-bg); border-radius: 10px; border: 2px solid var(--btn-bg); display: flex; flex-direction: column; transition: right 0.3s ease; z-index: 99; box-shadow: -5px 5px 15px rgba(0,0,0,0.5); }
        .chat-panel.open { right: 20px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 14px; word-wrap: break-word; }
        .message.mine { background-color: var(--btn-bg); color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .message.theirs { background-color: #333; color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; padding: 10px; background-color: var(--panel-bg); border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
        .chat-input-area input { flex: 1; padding: 8px; border-radius: 5px; border: none; margin-left: 5px; }
        .voice-controls { padding: 10px; text-align: center; background-color: rgba(0,0,0,0.2); border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .mic-btn { background-color: #4caf50; width: 100%; }
        .mic-btn.active { background-color: #f44336; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); } }

        /* -------------- الدومنة -------------- */
        .bot-hand { display: flex; justify-content: center; gap: 5px; margin-top: 15px; min-height: 70px; }
        .bot-domino-back { width: 35px; height: 70px; background: linear-gradient(135deg, #16213e 25%, #1a1a2e 25%, #1a1a2e 50%, #16213e 50%, #16213e 75%, #1a1a2e 75%, #1a1a2e 100%); background-size: 10px 10px; border-radius: 5px; border: 2px solid #000; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .game-board { flex: 1; background-color: var(--board-bg); border-radius: 15px; margin: 10px 20px; position: relative; display: flex; justify-content: center; align-items: center; flex-wrap: nowrap; overflow-x: auto; border: 10px solid #5c4033; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); padding: 20px; scroll-behavior: smooth; }
        .player-hand { display: flex; justify-content: center; gap: 10px; padding: 15px; background-color: var(--panel-bg); flex-wrap: wrap; min-height: 140px; align-items: center; }
        .domino { width: 50px; height: 100px; background-color: #fdf5e6; border-radius: 8px; display: flex; flex-direction: column; border: 1px solid #222; box-shadow: 3px 3px 6px rgba(0,0,0,0.6), inset 0 0 5px rgba(0,0,0,0.1); cursor: pointer; padding: 4px; transition: all 0.2s ease-in-out; flex-shrink: 0; }
        .playable-glow { box-shadow: 0 0 15px #00ff88, inset 0 0 5px rgba(0, 255, 136, 0.3) !important; border: 2px solid #00ff88 !important; transform: translateY(-8px); }
        .domino-horizontal { width: 100px; height: 50px; flex-direction: row; }
        .player-hand .domino:hover { transform: translateY(-12px); }
        .domino .half { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; justify-items: center; }
        .domino .divider { height: 2px; background-color: #222; width: 100%; margin: 2px 0; }
        .domino-horizontal .divider { width: 2px; height: 100%; margin: 0 2px; }
        .dot { width: 10px; height: 10px; background-color: #111; border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4); }
        .board-domino { margin: 1px; cursor: default; }
        .board-domino:hover { transform: none; }
        
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }
        .points-popup { position: absolute; color: #ffeb3b; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 5px #000; animation: floatUp 1.5s ease-out forwards; z-index: 1000; pointer-events: none; }
        .action-panel { display: flex; justify-content: center; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>

    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#94b082">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Failed', err));
        });
      }
    </script>
</head>
<body>

    <header>
        <h1>🎲 دومنة SpyGame</h1>
        <div>
            <span id="connection-status" style="color: #4caf50; margin-left: 15px;">جاهز للعب</span>
            <button onclick="toggleTheme()">💡 تغيير المود</button>
        </div>
    </header>

    <div class="container" id="main-menu">
        <div class="menu-card">
            <h2>اختار طريقة اللعب</h2>
            <button onclick="showScreen('offline-setup')">🤖 العب أوفلاين (مع البوت)</button>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.1);">
            <button onclick="showScreen('online-setup')">🌐 العب أونلاين</button>
        </div>
    </div>

    <div class="container hidden" id="offline-setup">
        <div class="menu-card">
            <h2>إعدادات الأوفلاين</h2>
            <div class="form-group">
                <label>نوع اللعبة:</label>
                <select id="off-game-mode">
                    <option value="normal">عادي (تجميع ورق)</option>
                    <option value="amricani">أمريكاني (خمسات)</option>
                </select>
            </div>
            <div class="form-group">
                <label>مستوى البوت:</label>
                <select id="off-bot-level">
                    <option value="easy">سهل (عشوائي)</option>
                    <option value="medium">متوسط (بيتخلص من الورق التقيل)</option>
                    <option value="hard">صعب (بيحسب الورق والخمسات)</option>
                </select>
            </div>
            <div class="form-group">
                <label>الهدف (السكور):</label>
                <select id="off-score">
                    <option value="50">50 نقطة</option>
                    <option value="100">100 نقطة</option>
                </select>
            </div>
            <button onclick="startOfflineGame()">🚀 ابدأ اللعب</button>
            <button onclick="showScreen('main-menu')" style="background-color: #555;">رجوع</button>
        </div>
    </div>

    <div class="container hidden" id="online-setup">
        <div class="menu-card">
            <h2>لعب أونلاين (شات وفويس)</h2>
            <div class="form-group">
                <label>اسمك:</label>
                <input type="text" id="player-name" placeholder="مثال: أحمد" value="لاعب">
            </div>
            <div class="form-group">
                <label>رقم الغرفة (للانضمام):</label>
                <input type="text" id="room-code" placeholder="ROOM-123">
            </div>
            <button onclick="joinRoom()">🔗 انضم للغرفة</button>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.1);">
            <h3>أو</h3>
            <button onclick="createRoom()">➕ أنشئ غرفة جديدة</button>
            <br><br>
            <button onclick="showScreen('main-menu')" style="background-color: #555;">رجوع</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <button id="chat-toggle-btn" class="chat-btn hidden" onclick="toggleChat()">💬</button>
        <div id="chat-panel" class="chat-panel hidden">
            <div class="voice-controls">
                <button id="mic-btn" class="mic-btn" onclick="toggleMic()">🎤 افتح المايك</button>
                <audio id="remote-audio" autoplay></audio>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>

        <div class="game-header">
            <button onclick="exitToMenu()" style="background-color: #f44336; margin: 0;">🚪 خروج</button>
            <div class="scoreboard">
                <span class="score-item">سكورك: <span id="ui-player-score">0</span></span>
                <span style="color: #fff;">الهدف: <span id="ui-target-score">50</span></span>
                <span class="score-bot">الخصم: <span id="ui-bot-score">0</span></span>
            </div>
        </div>

        <div style="text-align: center; margin-top: 10px;">
            <h3 id="game-info" style="color: #00ff88;">الدور: دورك أنت</h3>
        </div>

        <div class="bot-hand" id="bot-hand"></div>
        
        <div class="game-board" id="board">
            <p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>
        </div>

        <div class="action-panel">
            <span>📭 الورق في البلاطة: <span id="deck-count" style="color: #ffeb3b; font-size: 18px;">0</span></span>
            <span id="mode-badge" style="margin-right: 15px; background: #2196f3; padding: 2px 10px; border-radius: 5px;">عادي</span>
        </div>

        <div class="player-hand" id="my-hand"></div>
    </div>

    <script>
        // --- حماية للـ Firebase عشان الصفحة ماتضربش لو أنت فاتح من الكمبيوتر محلياً ---
        let db = null;
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
                authDomain: "spygame-337ee.firebaseapp.com",
                databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
                projectId: "spygame-337ee",
                storageBucket: "spygame-337ee.firebasestorage.app"
            };
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (error) {
            console.warn("الفايربيز محملش، اللعب الأوفلاين هيشتغل عادي.");
            document.getElementById('connection-status').innerText = "متصل أوفلاين فقط";
            document.getElementById('connection-status').style.color = "#ff9800";
        }

        // --- متغيرات اللعبة الأساسية ---
        let currentMode = 'offline'; 
        let deck = [], playersHands = [];
        let leftEnd = null, rightEnd = null, leftEndIsDouble = false, rightEndIsDouble = false;
        let currentTurn = 0, tableBones = []; 
        let playerScore = 0, botScore = 0, targetScore = 50;
        let gameMode = 'normal', botLevel = 'easy', gameActive = false;
        
        let onlineRoomId = null, myPlayerId = null, myName = "لاعب";
        let localStream, peerConnection, isMicOn = false;
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

        // --- دوال الواجهة والتحكم ---
        function toggleTheme() {
            const root = document.documentElement;
            root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        }

        function showScreen(screenId) {
            document.querySelectorAll('.container, #game-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'game-screen') {
                document.getElementById('game-screen').style.display = 'flex';
            } else {
                document.getElementById('game-screen').style.display = 'none';
            }
        }

        function exitToMenu() {
            if(confirm('متأكد إنك عايز تخرج؟ الجيم والسكور الحالي هيتمسحوا!')) {
                clearSave();
                if(localStream) localStream.getTracks().forEach(track => track.stop());
                if(peerConnection) peerConnection.close();
                showScreen('main-menu');
            }
        }

        // --- الشات والفويس (الأونلاين) ---
        function toggleChat() { document.getElementById('chat-panel').classList.toggle('open'); }

        function sendChatMessage() {
            if(!db) return alert("الفايربيز مش شغال عندك.");
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !onlineRoomId) return;
            db.ref(`rooms/${onlineRoomId}/chat`).push({ sender: myName, playerId: myPlayerId, text: text });
            input.value = '';
        }

        function listenToChat() {
            if(!db) return;
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.innerHTML = ''; 
            db.ref(`rooms/${onlineRoomId}/chat`).on('child_added', snapshot => {
                const msg = snapshot.val();
                const msgEl = document.createElement('div');
                msgEl.className = `message ${(msg.playerId === myPlayerId) ? 'mine' : 'theirs'}`;
                msgEl.innerText = `${msg.sender}: ${msg.text}`;
                messagesDiv.appendChild(msgEl);
                messagesDiv.scrollTop = messagesDiv.scrollHeight; 
            });
        }

        async function setupWebRTC() {
            peerConnection = new RTCPeerConnection(servers);
            peerConnection.ontrack = event => { document.getElementById('remote-audio').srcObject = event.streams[0]; };
            peerConnection.onicecandidate = event => {
                if (event.candidate && db) db.ref(`rooms/${onlineRoomId}/webrtc/candidates/${myPlayerId}`).push(event.candidate.toJSON());
            };
            const otherPlayerId = (myPlayerId === 'p1') ? 'p2' : 'p1';
            if(db) {
                db.ref(`rooms/${onlineRoomId}/webrtc/candidates/${otherPlayerId}`).on('child_added', snapshot => {
                    peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
                });
            }
        }

        async function toggleMic() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("للأسف الفويس شات مبيشتغلش وأنت فاتح اللعبة كملف من الكمبيوتر (file://)، عشان الحماية. لازم ترفعها على استضافة الأول.");
                return;
            }

            const micBtn = document.getElementById('mic-btn');
            if (!isMicOn) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    if(!peerConnection) await setupWebRTC();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    if (myPlayerId === 'p1') {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        if(db) db.ref(`rooms/${onlineRoomId}/webrtc/offer`).set({ type: offer.type, sdp: offer.sdp });
                    } else {
                        if(db) {
                            db.ref(`rooms/${onlineRoomId}/webrtc/offer`).once('value', async snapshot => {
                                if (snapshot.val()) {
                                    await peerConnection.setRemoteDescription(new RTCSessionDescription(snapshot.val()));
                                    const answer = await peerConnection.createAnswer();
                                    await peerConnection.setLocalDescription(answer);
                                    db.ref(`rooms/${onlineRoomId}/webrtc/answer`).set({ type: answer.type, sdp: answer.sdp });
                                }
                            });
                        }
                    }
                    if (myPlayerId === 'p1' && db) {
                        db.ref(`rooms/${onlineRoomId}/webrtc/answer`).on('value', snapshot => {
                            if (snapshot.val() && !peerConnection.currentRemoteDescription) peerConnection.setRemoteDescription(new RTCSessionDescription(snapshot.val()));
                        });
                    }
                    micBtn.innerText = "🛑 اقفل المايك"; micBtn.classList.add('active'); isMicOn = true;
                } catch (error) { alert("لازم توافق على صلاحية المايكروفون عشان الفويس يشتغل!"); }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                micBtn.innerText = "🎤 افتح المايك"; micBtn.classList.remove('active'); isMicOn = false;
            }
        }

        function createRoom() {
            if(!db) return alert("مش هينفع تلعب أونلاين عشان اتصال الفايربيز متعطل عندك.");
            myName = document.getElementById('player-name').value || "الهوست";
            onlineRoomId = 'ROOM-' + Math.floor(Math.random() * 10000);
            myPlayerId = 'p1';
            db.ref('rooms/' + onlineRoomId).set({ status: 'waiting', players: 1 }).then(() => {
                startOnlineUI(); listenToChat();
                document.getElementById('game-info').innerText = `منتظر الخصم... الغرفة: ${onlineRoomId}`;
            });
        }

        function joinRoom() {
            if(!db) return alert("مش هينفع تلعب أونلاين عشان اتصال الفايربيز متعطل عندك.");
            myName = document.getElementById('player-name').value || "الضيف";
            const roomCode = document.getElementById('room-code').value.trim();
            if(!roomCode) return alert("اكتب رقم الغرفة!");
            db.ref('rooms/' + roomCode).once('value', snapshot => {
                if(snapshot.exists()) {
                    onlineRoomId = roomCode; myPlayerId = 'p2';
                    db.ref('rooms/' + onlineRoomId).update({ players: 2, status: 'playing' });
                    startOnlineUI(); listenToChat();
                    document.getElementById('game-info').innerText = `تم الانضمام! الغرفة: ${onlineRoomId}`;
                } else alert("الغرفة دي مش موجودة يا هندسة!");
            });
        }

        function startOnlineUI() {
            currentMode = 'online';
            document.getElementById('chat-toggle-btn').classList.remove('hidden');
            document.getElementById('chat-panel').classList.remove('hidden');
            showScreen('game-screen');
        }

        // --- الحفظ للريفريش ---
        function saveGame() {
            if (!gameActive || currentMode !== 'offline') return;
            const gameState = { deck, playersHands, leftEnd, rightEnd, currentTurn, playerScore, botScore, targetScore, tableBones, leftEndIsDouble, rightEndIsDouble, gameMode, botLevel, gameActive: true };
            localStorage.setItem('domino_spygame_save', JSON.stringify(gameState));
        }

        function clearSave() { gameActive = false; localStorage.removeItem('domino_spygame_save'); }

        // --- اللوجيك الخاص بالدومنة ---
        function generateDeck() { deck = []; for (let i = 0; i <= 6; i++) { for (let j = i; j <= 6; j++) { deck.push([i, j]); } } }
        function shuffleDeck() { for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } }

        function dealCards(numPlayers) {
            playersHands = Array.from({ length: numPlayers }, () => []);
            for (let i = 0; i < 7; i++) { for (let p = 0; p < numPlayers; p++) { playersHands[p].push(deck.pop()); } }
            updateDeckCountUI(); renderBotHand(); saveGame();
        }

        function updateDeckCountUI() {
            document.getElementById('deck-count').innerText = deck.length;
            document.getElementById('ui-player-score').innerText = playerScore;
            document.getElementById('ui-bot-score').innerText = botScore;
            document.getElementById('ui-target-score').innerText = targetScore;
            document.getElementById('mode-badge').innerText = (gameMode === 'amricani') ? 'أمريكاني 🇺🇸' : 'عادي 🇪🇬';
        }

        function renderBotHand() {
            const botHandDiv = document.getElementById('bot-hand');
            botHandDiv.innerHTML = '';
            let bHand = playersHands[1];
            if(!bHand) return;
            for(let i = 0; i < bHand.length; i++) {
                let backEl = document.createElement('div');
                backEl.className = 'bot-domino-back';
                botHandDiv.appendChild(backEl);
            }
        }

        function createDominoHTML(n1, n2) {
            function getHalf(num) {
                const patterns = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
                let html = '<div class="half">';
                for(let i = 0; i < 9; i++) { html += patterns[num].includes(i) ? '<div class="dot"></div>' : '<div></div>'; }
                return html + '</div>';
            }
            return getHalf(n1) + '<div class="divider"></div>' + getHalf(n2);
        }

        function renderHand(handIndex) {
            const handDiv = document.getElementById('my-hand');
            handDiv.innerHTML = ''; 
            playersHands[handIndex].forEach((bone, index) => {
                const boneEl = document.createElement('div');
                boneEl.className = 'domino';
                if (handIndex === 0 && currentTurn === 0) {
                    let isPlayable = false;
                    if (leftEnd === null && rightEnd === null) isPlayable = true;
                    else if (bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd) isPlayable = true;
                    if (isPlayable) boneEl.classList.add('playable-glow');
                }
                boneEl.innerHTML = createDominoHTML(bone[0], bone[1]);
                boneEl.onclick = () => playBone(handIndex, index);
                handDiv.appendChild(boneEl);
            });
        }

        function hasValidMove(hand) {
            if (leftEnd === null && rightEnd === null) return true; 
            return hand.some(bone => bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd);
        }

        function showPointsPopup(points, who) {
            let popup = document.createElement('div'); popup.className = 'points-popup'; popup.innerText = `+${points}`;
            let board = document.getElementById('board');
            if (who === 'player') { popup.style.bottom = '20px'; popup.style.left = '50%'; } else { popup.style.top = '20px'; popup.style.left = '50%'; }
            board.appendChild(popup); setTimeout(() => popup.remove(), 1500);
        }

        function calculateAmricaniScore(bone, playAt, flip) {
            let newLeftEnd = leftEnd, newRightEnd = rightEnd, newLeftIsDouble = leftEndIsDouble, newRightIsDouble = rightEndIsDouble;
            if (leftEnd === null) { let sum = bone[0] + bone[1]; return (sum % 5 === 0) ? sum : 0; }
            if (playAt === 'right') { newRightEnd = flip ? bone[0] : bone[1]; newRightIsDouble = (bone[0] === bone[1]); }
            else { newLeftEnd = flip ? bone[1] : bone[0]; newLeftIsDouble = (bone[0] === bone[1]); }
            let sum = (newLeftIsDouble ? newLeftEnd * 2 : newLeftEnd) + (newRightIsDouble ? newRightEnd * 2 : newRightEnd);
            return (sum % 5 === 0) ? sum : 0;
        }

        function addDominoToBoardDOM(bone, side, flip, isBot = false, isLoading = false) {
            const board = document.getElementById('board');
            const emptyMsg = document.getElementById('empty-msg');
            if(emptyMsg) emptyMsg.remove();
            if (!isLoading) tableBones.push({ bone, side, flip, isBot });

            const isDouble = bone[0] === bone[1];
            const boneEl = document.createElement('div');
            boneEl.className = 'domino board-domino';
            if (isBot) boneEl.style.boxShadow = "0 0 10px rgba(255, 68, 68, 0.8)"; 
            
            let htmlStr = '';
            if (isDouble) { htmlStr = createDominoHTML(bone[0], bone[1]); }
            else { boneEl.classList.add('domino-horizontal'); htmlStr = flip ? createDominoHTML(bone[1], bone[0]) : createDominoHTML(bone[0], bone[1]); }
            
            boneEl.innerHTML = htmlStr;
            if (side === 'left') board.prepend(boneEl); else board.appendChild(boneEl);
            setTimeout(() => { boneEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }, 50);
            if (!isLoading) saveGame();
        }

        function calculateHandScore(hand) { return hand.reduce((sum, bone) => sum + bone[0] + bone[1], 0); }

        function checkRoundEnd() {
            let pHand = playersHands[0], bHand = playersHands[1];
            if (pHand.length === 0 || bHand.length === 0 || (!hasValidMove(pHand) && !hasValidMove(bHand) && deck.length === 0)) {
                let pScore = calculateHandScore(pHand), bScore = calculateHandScore(bHand);
                clearSave();
                let msg = "";
                if (pScore < bScore) { playerScore += bScore; msg = `عاش! أنت كسبت الجولة وخدت ${bScore} نقطة.`; }
                else if (bScore < pScore) { botScore += pScore; msg = `البوت كسب الجولة دي وخد ${pScore} نقطة.`; }
                else { msg = `قفلة! تعادل في الورق (${pScore}). مفيش حد هياخد نقط.`; }
                endRoundAlert(msg, playerScore, botScore);
                return true;
            }
            return false;
        }

        function endRoundAlert(msg, pScore, bScore) {
            updateDeckCountUI();
            setTimeout(() => {
                alert(msg + `\n\nالسكور الحالي: أنت ${pScore} - البوت ${bScore}`);
                if (playerScore >= targetScore) { alert("🎉 مبروووك! أنت كسبت الجيم كله!"); clearSave(); showScreen('main-menu'); }
                else if (botScore >= targetScore) { alert("💀 البوت كسب الجيم ده! هارد لك."); clearSave(); showScreen('main-menu'); }
                else { startNewRound(); }
            }, 600);
        }

        function startOfflineGame() {
            currentMode = 'offline';
            document.getElementById('chat-toggle-btn').classList.add('hidden');
            document.getElementById('chat-panel').classList.add('hidden');
            targetScore = parseInt(document.getElementById('off-score').value);
            gameMode = document.getElementById('off-game-mode').value;
            botLevel = document.getElementById('off-bot-level').value;
            playerScore = 0; botScore = 0; gameActive = true;
            startNewRound(); showScreen('game-screen');
        }

        function startNewRound() {
            gameActive = true;
            document.getElementById('board').innerHTML = '<p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>';
            leftEnd = null; rightEnd = null; leftEndIsDouble = false; rightEndIsDouble = false; tableBones = []; 
            generateDeck(); shuffleDeck(); dealCards(2); playerTurnInit();
        }

        function playerTurnInit() {
            currentTurn = 0;
            document.getElementById('game-info').innerText = `الدور: دورك أنت`;
            document.getElementById('game-info').style.color = `#00ff88`;
            renderHand(0); saveGame();

            if (!hasValidMove(playersHands[0])) {
                if (deck.length > 0) {
                    document.getElementById('game-info').innerText = `بتسحب من البلاطة تلقائي...`; document.getElementById('game-info').style.color = `#ffeb3b`;
                    let autoDraw = setInterval(() => {
                        if (deck.length > 0 && !hasValidMove(playersHands[0])) {
                            playersHands[0].push(deck.pop()); updateDeckCountUI(); renderHand(0); saveGame();
                        } else {
                            clearInterval(autoDraw);
                            if (hasValidMove(playersHands[0])) {
                                document.getElementById('game-info').innerText = `الدور: دورك أنت (العب ورقة منورة)`; document.getElementById('game-info').style.color = `#00ff88`; saveGame();
                            } else { alert("البلاطة فضيت ومعكش لعب! الدور هيباصي للبوت."); passToBot(); }
                        }
                    }, 600); 
                } else { alert("معكش لعب والبلاطة فاضية! الدور هيباصي للبوت."); passToBot(); }
            }
        }

        function passToBot() {
            if (checkRoundEnd()) return; 
            currentTurn = 1; document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`; document.getElementById('game-info').style.color = `#ff4444`;
            renderHand(0); saveGame(); setTimeout(botPlay, 1000);
        }

        function playBone(playerIndex, boneIndex, forcePlayAt = null, forceFlip = null) {
            if (currentTurn !== playerIndex) return; 
            let bone = playersHands[playerIndex][boneIndex];
            let playAt = forcePlayAt, flip = forceFlip;

            if (playAt === null) {
                if (leftEnd === null && rightEnd === null) playAt = 'right';
                else if (bone[0] === rightEnd) { playAt = 'right'; flip = false; }
                else if (bone[1] === rightEnd) { playAt = 'right'; flip = true; }
                else if (bone[0] === leftEnd) { playAt = 'left'; flip = true; }
                else if (bone[1] === leftEnd) { playAt = 'left'; flip = false; }
                else { alert('الورقة دي ماتركبش! العب من الورق اللي منور أخضر بس.'); return; }
            }

            if (gameMode === 'amricani') {
                let points = calculateAmricaniScore(bone, playAt, flip);
                if (points > 0) {
                    if (playerIndex === 0) { playerScore += points; showPointsPopup(points, 'player'); }
                    else { botScore += points; showPointsPopup(points, 'bot'); }
                    updateDeckCountUI();
                }
            }

            playersHands[playerIndex].splice(boneIndex, 1);
            if (leftEnd === null && rightEnd === null) { leftEnd = bone[0]; rightEnd = bone[1]; leftEndIsDouble = rightEndIsDouble = (bone[0] === bone[1]); } 
            else if (playAt === 'right') { rightEnd = flip ? bone[0] : bone[1]; rightEndIsDouble = (bone[0] === bone[1]); } 
            else if (playAt === 'left') { leftEnd = flip ? bone[1] : bone[0]; leftEndIsDouble = (bone[0] === bone[1]); }

            addDominoToBoardDOM(bone, playAt, flip, playerIndex !== 0);
            if (playerIndex === 0) renderHand(0); else renderBotHand();
            if (checkRoundEnd()) return;

            if (playerIndex === 0) {
                currentTurn = 1; document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`; document.getElementById('game-info').style.color = `#ff4444`;
                renderHand(0); saveGame(); setTimeout(botPlay, 1200);
            } else { setTimeout(playerTurnInit, 500); }
        }

        function executeBotMove() {
            let hand = playersHands[1], validMoves = [];
            for (let i = 0; i < hand.length; i++) {
                let b = hand[i];
                if (leftEnd === null && rightEnd === null) { validMoves.push({ index: i, bone: b, playAt: 'right', flip: false }); } 
                else {
                    if (b[0] === rightEnd) validMoves.push({ index: i, bone: b, playAt: 'right', flip: false });
                    if (b[1] === rightEnd) validMoves.push({ index: i, bone: b, playAt: 'right', flip: true });
                    if (b[0] === leftEnd) validMoves.push({ index: i, bone: b, playAt: 'left', flip: true });
                    if (b[1] === leftEnd) validMoves.push({ index: i, bone: b, playAt: 'left', flip: false });
                }
            }

            if (botLevel === 'easy') {
                let randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                playBone(1, randomMove.index, randomMove.playAt, randomMove.flip);
            } else if (botLevel === 'medium') {
                validMoves.sort((a, b) => (b.bone[0] + b.bone[1]) - (a.bone[0] + a.bone[1]));
                let best = validMoves[0]; playBone(1, best.index, best.playAt, best.flip);
            } else if (botLevel === 'hard') {
                if (gameMode === 'amricani') {
                    validMoves.forEach(m => { m.points = calculateAmricaniScore(m.bone, m.playAt, m.flip); m.weight = m.bone[0] + m.bone[1]; });
                    validMoves.sort((a, b) => { if (b.points !== a.points) return b.points - a.points; return b.weight - a.weight; });
                } else {
                    validMoves.forEach(m => { m.weight = m.bone[0] + m.bone[1]; m.isDouble = (m.bone[0] === m.bone[1]) ? 1 : 0; });
                    validMoves.sort((a, b) => { if (a.isDouble !== b.isDouble) return b.isDouble - a.isDouble; return b.weight - a.weight; });
                }
                let best = validMoves[0]; playBone(1, best.index, best.playAt, best.flip);
            }
        }

        function botPlay() {
            let hand = playersHands[1];
            if(!hand) return;
            if (hasValidMove(hand)) { executeBotMove(); } 
            else if (deck.length > 0) {
                document.getElementById('game-info').innerText = `البوت بيسحب من البلاطة... 📭`;
                let drawInterval = setInterval(() => {
                    if (deck.length > 0 && !hasValidMove(hand)) {
                        hand.push(deck.pop()); updateDeckCountUI(); renderBotHand(); saveGame();
                    } else {
                        clearInterval(drawInterval);
                        if (hasValidMove(hand)) executeBotMove(); else botPass();
                    }
                }, 600);
            } else { botPass(); }
        }

        function botPass() {
            if (checkRoundEnd()) return; 
            alert("البوت باصى الدور عشان معهوش لعب والبلاطة فاضية! 🛑");
            playerTurnInit(); 
        }

        function checkSavedGame() {
            try {
                const savedData = localStorage.getItem('domino_spygame_save');
                if (savedData) {
                    const state = JSON.parse(savedData);
                    if (state.gameActive) {
                        deck = state.deck; playersHands = state.playersHands; leftEnd = state.leftEnd; rightEnd = state.rightEnd;
                        leftEndIsDouble = state.leftEndIsDouble || false; rightEndIsDouble = state.rightEndIsDouble || false;
                        gameMode = state.gameMode || 'normal'; botLevel = state.botLevel || 'easy';
                        currentTurn = state.currentTurn; playerScore = state.playerScore; botScore = state.botScore;
                        targetScore = state.targetScore; tableBones = state.tableBones; gameActive = true; currentMode = 'offline';

                        updateDeckCountUI(); renderBotHand(); showScreen('game-screen');
                        
                        document.getElementById('chat-toggle-btn').classList.add('hidden');
                        document.getElementById('chat-panel').classList.add('hidden');

                        const board = document.getElementById('board'); board.innerHTML = '';
                        if (tableBones.length === 0) { board.innerHTML = '<p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>'; } 
                        else { tableBones.forEach(item => { addDominoToBoardDOM(item.bone, item.side, item.flip, item.isBot, true); }); }

                        if (currentTurn === 0) playerTurnInit();
                        else { document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`; document.getElementById('game-info').style.color = `#ff4444`; renderHand(0); setTimeout(botPlay, 1000); }
                        return; 
                    }
                }
            } catch (error) { clearSave(); }
        }

        // --- الماكينة بتشتغل هنا أول ما تفتح ---
        window.onload = checkSavedGame;
    </script>
</body>
