<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدومنة </title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --text-color: #e94560;
            --text-main: #fff;
            --board-bg: #0f3418;
            --btn-bg: #e94560;
            --btn-hover: #d1304b;
        }

        :root[data-theme="light"] {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --text-color: #333;
            --text-main: #111;
            --board-bg: #2e7d32;
            --btn-bg: #1976d2;
            --btn-hover: #1565c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-main); transition: all 0.3s ease; height: 100vh; display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--panel-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        button { background-color: var(--btn-bg); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; margin: 5px; }
        button:hover { background-color: var(--btn-hover); }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .menu-card { background-color: var(--panel-bg); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        .menu-card h2 { color: var(--text-color); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; background: #fff; color: #333; }

        #game-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        /* لوحة السكور */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background-color: var(--panel-bg);
            padding: 10px;
            margin: 10px 20px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid var(--btn-bg);
        }
        .score-item { color: #00ff88; }
        .score-bot { color: #ff4444; }

        .game-board {
            flex: 1;
            background-color: var(--board-bg);
            border-radius: 15px;
            margin: 10px 20px;
            position: relative;
            display: flex;
            justify-content: center; 
            align-items: center;
            flex-wrap: nowrap; 
            overflow-x: auto; 
            border: 10px solid #5c4033;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            padding: 20px;
        }

        .player-hand { display: flex; justify-content: center; gap: 10px; padding: 15px; background-color: var(--panel-bg); flex-wrap: wrap; min-height: 140px; align-items: center; }

        .domino {
            width: 50px;
            height: 100px;
            background-color: #fdf5e6; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.6), inset 0 0 5px rgba(0,0,0,0.1);
            cursor: pointer;
            padding: 4px;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        .playable-glow {
            box-shadow: 0 0 15px #00ff88, inset 0 0 5px rgba(0, 255, 136, 0.3) !important;
            border: 2px solid #00ff88 !important;
            transform: translateY(-8px); 
        }
        
        .domino-horizontal { width: 100px; height: 50px; flex-direction: row; }
        .player-hand .domino:hover { transform: translateY(-12px); }

        .domino .half { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; justify-items: center; }
        .domino .divider { height: 2px; background-color: #222; width: 100%; margin: 2px 0; box-shadow: 0 1px 0 rgba(255,255,255,0.8); }
        .domino-horizontal .divider { width: 2px; height: 100%; margin: 0 2px; }

        .dot { width: 10px; height: 10px; background-color: #111; border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4); }

        .board-domino { margin: 1px; cursor: default; }
        .board-domino:hover { transform: none; }

        .action-panel { display: flex; justify-content: center; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>🎲 دومنة SpyGame</h1>
        <div>
            <span id="connection-status" style="color: #4caf50; margin-left: 15px;">متصل بالنت</span>
            <button onclick="toggleTheme()">💡 تغيير المود</button>
        </div>
    </header>

    <div class="container" id="main-menu">
        <div class="menu-card">
            <h2>اختار طريقة اللعب</h2>
            <button onclick="showScreen('offline-setup')">🤖 العب أوفلاين (مع البوت)</button>
            <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.1);">
            <button onclick="showScreen('online-setup')">🌐 العب أونلاين</button>
        </div>
    </div>

    <div class="container hidden" id="offline-setup">
        <div class="menu-card">
            <h2>إعدادات اللعب مع البوت</h2>
            <div class="form-group">
                <label>الهدف (السكور):</label>
                <select id="off-score">
                    <option value="50">50 نقطة</option>
                    <option value="100">100 نقطة</option>
                </select>
            </div>
            <button onclick="startOfflineGame()">🚀 ابدأ اللعب</button>
            <button onclick="showScreen('main-menu')" style="background-color: #555;">رجوع</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="scoreboard">
            <span class="score-item">سكورك أنت: <span id="ui-player-score">0</span></span>
            <span style="color: #fff;">الهدف: <span id="ui-target-score">50</span></span>
            <span class="score-bot">سكور البوت: <span id="ui-bot-score">0</span></span>
        </div>

        <div style="text-align: center; padding: 10px;">
            <h3 id="game-info" style="color: #00ff88;">الدور: دورك أنت</h3>
        </div>
        
        <div class="game-board" id="board">
            <p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>
        </div>

        <div class="action-panel">
            <span>📭 الورق في البلاطة: <span id="deck-count" style="color: #ffeb3b; font-size: 18px;">0</span></span>
        </div>

        <div class="player-hand" id="my-hand"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
            authDomain: "spygame-337ee.firebaseapp.com",
            databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
            projectId: "spygame-337ee",
            storageBucket: "spygame-337ee.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);

        function toggleTheme() {
            const root = document.documentElement;
            root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        }

        function showScreen(screenId) {
            document.querySelectorAll('.container, #game-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'game-screen') document.getElementById('game-screen').style.display = 'flex';
        }

        let deck = [], playersHands = [];
        let leftEnd = null, rightEnd = null;
        let currentTurn = 0; 
        
        let playerScore = 0;
        let botScore = 0;
        let targetScore = 50;

        function generateDeck() {
            deck = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) {
                    deck.push([i, j]);
                }
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function dealCards(numPlayers) {
            playersHands = Array.from({ length: numPlayers }, () => []);
            for (let i = 0; i < 7; i++) {
                for (let p = 0; p < numPlayers; p++) {
                    playersHands[p].push(deck.pop());
                }
            }
            updateDeckCountUI();
        }

        function updateDeckCountUI() {
            document.getElementById('deck-count').innerText = deck.length;
            document.getElementById('ui-player-score').innerText = playerScore;
            document.getElementById('ui-bot-score').innerText = botScore;
            document.getElementById('ui-target-score').innerText = targetScore;
        }

        function createDominoHTML(n1, n2) {
            function getHalf(num) {
                const patterns = {
                    0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 
                    4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
                };
                let html = '<div class="half">';
                for(let i = 0; i < 9; i++) {
                    html += patterns[num].includes(i) ? '<div class="dot"></div>' : '<div></div>';
                }
                html += '</div>';
                return html;
            }
            return getHalf(n1) + '<div class="divider"></div>' + getHalf(n2);
        }

        function renderHand(handIndex) {
            const handDiv = document.getElementById('my-hand');
            handDiv.innerHTML = ''; 
            
            playersHands[handIndex].forEach((bone, index) => {
                const boneEl = document.createElement('div');
                boneEl.className = 'domino';

                if (handIndex === 0 && currentTurn === 0) {
                    let isPlayable = false;
                    if (leftEnd === null && rightEnd === null) isPlayable = true;
                    else if (bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd) isPlayable = true;

                    if (isPlayable) boneEl.classList.add('playable-glow');
                }

                boneEl.innerHTML = createDominoHTML(bone[0], bone[1]);
                boneEl.onclick = () => playBone(handIndex, index);
                handDiv.appendChild(boneEl);
            });
        }

        function hasValidMove(hand) {
            if (leftEnd === null && rightEnd === null) return true; 
            return hand.some(bone => bone[0] === leftEnd || bone[1] === leftEnd || bone[0] === rightEnd || bone[1] === rightEnd);
        }

        function addDominoToBoardDOM(bone, side, flip, isBot = false) {
            const board = document.getElementById('board');
            const emptyMsg = document.getElementById('empty-msg');
            if(emptyMsg) emptyMsg.remove();

            const isDouble = bone[0] === bone[1];
            const boneEl = document.createElement('div');
            boneEl.className = 'domino board-domino';
            if (isBot) boneEl.style.boxShadow = "0 0 10px rgba(255, 68, 68, 0.8)"; 
            
            let htmlStr = '';
            if (isDouble) {
                htmlStr = createDominoHTML(bone[0], bone[1]);
            } else {
                boneEl.classList.add('domino-horizontal');
                htmlStr = flip ? createDominoHTML(bone[1], bone[0]) : createDominoHTML(bone[0], bone[1]);
            }
            
            boneEl.innerHTML = htmlStr;
            if (side === 'left') board.prepend(boneEl);
            else board.appendChild(boneEl);
        }

        function calculateHandScore(hand) {
            return hand.reduce((sum, bone) => sum + bone[0] + bone[1], 0);
        }

        function checkRoundEnd() {
            let pHand = playersHands[0];
            let bHand = playersHands[1];

            if (pHand.length === 0) {
                let points = calculateHandScore(bHand);
                playerScore += points;
                endRoundAlert(`عاش! أنت خلصت ورقك وكسبت الجولة. خدت ${points} نقطة من البوت.`, playerScore, botScore);
                return true;
            }
            if (bHand.length === 0) {
                let points = calculateHandScore(pHand);
                botScore += points;
                endRoundAlert(`البوت خلص ورقه الأول! البوت خد ${points} نقطة.`, playerScore, botScore);
                return true;
            }

            let pCanMove = hasValidMove(pHand);
            let bCanMove = hasValidMove(bHand);
            if (!pCanMove && !bCanMove && deck.length === 0) {
                let pScore = calculateHandScore(pHand);
                let bScore = calculateHandScore(bHand);
                
                if (pScore < bScore) {
                    playerScore += bScore;
                    endRoundAlert(`قفلة! ورقك أخف من البوت (${pScore} ضد ${bScore}). أنت كسبت وخدت ${bScore} نقطة.`, playerScore, botScore);
                } else if (bScore < pScore) {
                    botScore += pScore;
                    endRoundAlert(`قفلة! ورق البوت أخف منك (${bScore} ضد ${pScore}). البوت كسب وخد ${pScore} نقطة.`, playerScore, botScore);
                } else {
                    endRoundAlert(`قفلة! تعادل في الورق (${pScore}). مفيش حد هياخد نقط الجولة دي.`, playerScore, botScore);
                }
                return true;
            }
            return false;
        }

        function endRoundAlert(msg, pScore, bScore) {
            updateDeckCountUI();
            setTimeout(() => {
                alert(msg + `\n\nالسكور الحالي: أنت ${pScore} - البوت ${bScore}`);
                
                if (playerScore >= targetScore) {
                    alert("🎉 مبروووك! أنت كسبت الجيم كله!");
                    showScreen('main-menu');
                } else if (botScore >= targetScore) {
                    alert("💀 البوت كسب الجيم ده! هارد لك، جرب تاني.");
                    showScreen('main-menu');
                } else {
                    startNewRound(); 
                }
            }, 500);
        }

        function startOfflineGame() {
            targetScore = parseInt(document.getElementById('off-score').value);
            playerScore = 0; botScore = 0;
            startNewRound();
            showScreen('game-screen');
        }

        function startNewRound() {
            document.getElementById('board').innerHTML = '<p id="empty-msg" style="color: rgba(255,255,255,0.5); width: 100%; text-align: center; position: absolute;">الطاولة فاضية، ابدأ اللعب</p>';
            leftEnd = null; rightEnd = null;
            generateDeck();
            shuffleDeck();
            dealCards(2);
            playerTurnInit();
        }

        function playerTurnInit() {
            currentTurn = 0;
            document.getElementById('game-info').innerText = `الدور: دورك أنت`;
            document.getElementById('game-info').style.color = `#00ff88`;
            renderHand(0);

            if (!hasValidMove(playersHands[0])) {
                if (deck.length > 0) {
                    document.getElementById('game-info').innerText = `بتسحب من البلاطة تلقائي...`;
                    document.getElementById('game-info').style.color = `#ffeb3b`;
                    
                    let autoDraw = setInterval(() => {
                        if (deck.length > 0 && !hasValidMove(playersHands[0])) {
                            let drawnBone = deck.pop();
                            playersHands[0].push(drawnBone);
                            updateDeckCountUI();
                            renderHand(0);
                        } else {
                            clearInterval(autoDraw);
                            if (hasValidMove(playersHands[0])) {
                                document.getElementById('game-info').innerText = `الدور: دورك أنت (العب ورقة منورة)`;
                                document.getElementById('game-info').style.color = `#00ff88`;
                            } else {
                                alert("البلاطة فضيت ومعكش لعب! الدور هيباصي للبوت.");
                                passToBot();
                            }
                        }
                    }, 600); 
                } else {
                    alert("معكش لعب والبلاطة فاضية! الدور هيباصي للبوت.");
                    passToBot();
                }
            }
        }

        function passToBot() {
            if (checkRoundEnd()) return; 
            currentTurn = 1;
            document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`;
            document.getElementById('game-info').style.color = `#ff4444`;
            renderHand(0); 
            setTimeout(botPlay, 1000);
        }

        // --- التعديل الرئيسي اللي حل المشكلة هنا ---
        function playBone(playerIndex, boneIndex) {
            if (currentTurn !== playerIndex) return; 

            let bone = playersHands[playerIndex][boneIndex];
            let playAt = null, flip = false;

            if (leftEnd === null && rightEnd === null) playAt = 'right';
            else if (bone[0] === rightEnd) { playAt = 'right'; flip = false; }
            else if (bone[1] === rightEnd) { playAt = 'right'; flip = true; }
            else if (bone[0] === leftEnd) { playAt = 'left'; flip = true; }
            else if (bone[1] === leftEnd) { playAt = 'left'; flip = false; }
            else {
                alert('الورقة دي ماتركبش! العب من الورق اللي منور أخضر بس.');
                return;
            }

            playersHands[playerIndex].splice(boneIndex, 1);
            if (leftEnd === null && rightEnd === null) { leftEnd = bone[0]; rightEnd = bone[1]; }
            else if (playAt === 'right') rightEnd = flip ? bone[0] : bone[1];
            else if (playAt === 'left') leftEnd = flip ? bone[1] : bone[0];

            addDominoToBoardDOM(bone, playAt, flip, playerIndex !== 0);
            renderHand(playerIndex); 

            if (checkRoundEnd()) return;

            // اللوجيك الجديد: التبديل الصح للأدوار
            if (playerIndex === 0) {
                // لو أنت اللي لعبت، الدور يروح للبوت
                currentTurn = 1;
                document.getElementById('game-info').innerText = `الدور: دور البوت 🤖...`;
                document.getElementById('game-info').style.color = `#ff4444`;
                renderHand(0); 
                setTimeout(botPlay, 1200);
            } else {
                // لو البوت هو اللي لعب، الدور يرجعلك
                setTimeout(playerTurnInit, 500); 
            }
        }

        function botPlay() {
            let hand = playersHands[1];
            if(!hand) return;

            if (hasValidMove(hand)) {
                executeBotMove();
            } else if (deck.length > 0) {
                document.getElementById('game-info').innerText = `البوت بيسحب من البلاطة... 📭`;
                
                let drawInterval = setInterval(() => {
                    if (deck.length > 0 && !hasValidMove(hand)) {
                        hand.push(deck.pop());
                        updateDeckCountUI();
                    } else {
                        clearInterval(drawInterval);
                        if (hasValidMove(hand)) executeBotMove();
                        else botPass();
                    }
                }, 600);
            } else {
                botPass();
            }
        }

        function executeBotMove() {
            let hand = playersHands[1];
            for (let i = 0; i < hand.length; i++) {
                let bone = hand[i];
                if (leftEnd === null || bone[0] === rightEnd || bone[1] === rightEnd || bone[0] === leftEnd || bone[1] === leftEnd) {
                    playBone(1, i);
                    return; 
                }
            }
        }

        function botPass() {
            if (checkRoundEnd()) return; 
            alert("البوت باصى الدور عشان معهوش لعب والبلاطة فاضية! 🛑");
            playerTurnInit(); 
        }
    </script>
</body>
</html>
